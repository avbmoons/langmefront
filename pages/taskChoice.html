              <div class="info-title-block">
                <p class="info-title">Choice mode</p>
              </div>
              <div class="info-content-block">
                <div class="task-description">
                  <p class="info-content" id="taskDescription">
                    Choosing the right translation for each selected languages
                  </p>
                </div>
                <div class="task-langs">
                  <p class="info-content" id="taskPrimLang">Russian -></p>
                  <p class="info-content" id="taskCompLang">
                    Armenian, Greek, Finnish, Latvian
                  </p>

                <div class="task-themes">
                  <p class="info-content">
                    World sides, Seasons, Months, Weekdays, Personal data
                  </p>
                </div>
              </div>
              <div class="info-service-block">
                <button class="btn-link" id="changeModeBtn">Change mode</button>
                <button class="btn-link" onclick="openModalSettings()">
                  Change settings
                </button>
              </div>
            </div>
            <div class="task-settings">
              <div class="counter" id="counterWords">
                <label class="counter-label" for="">Show</label>
                <button
                  class="counter-btn"
                  id="btnPrevNumWords"
                  onclick="minusFunction(numWordsValue)"
                >
                  &#9668;
                </button>
                <input
                  class="counter-value"
                  id="numWordsValue"
                  type="text"
                  value="2"
                  title="2 words recomended"
                  readonly
                />
                <button
                  class="counter-btn"
                  id="btnNextNumWords"
                  onclick="plusFunction(numWordsValue)"
                >
                  &#9658;
                </button>
                <label class="counter-label" for="">words on the list</label>
              </div>
              <div class="counter" id="counterOptions">
                <label class="counter-label" for="">Show</label>
                <button
                  class="counter-btn"
                  id="btnPrevNumOpt"
                  onclick="minusFunction(numOptionsValue)"
                >
                  &#9668;
                </button>
                <input
                  class="counter-value"
                  id="numOptionsValue"
                  type="text"
                  value="3"
                  title="3 options recomended"
                  readonly
                />
                <button
                  class="counter-btn"
                  id="btnNextNumOpt"
                  onclick="plusFunction(numOptionsValue)"
                >
                  &#9658;
                </button>
                <label class="counter-label" for=""
                  >options for each word</label
                >
              </div>
              <div class="counter" id="radioSpell">
                <label class="counter-label" for="">Show spelling on</label>
                <input
                  class="counter-value"
                  type="radio"
                  name="spellChoice"
                  id="spellRus"
                  checked
                />
                <label class="counter-label" for="spellRus">Rus</label>
                <input
                  class="counter-value"
                  type="radio"
                  name="spellChoice"
                  id="spellEng"
                />
                <label class="counter-label" for="spellEng">Eng</label>
                <input
                  class="counter-value"
                  type="radio"
                  name="spellChoice"
                  id="spellNone"
                />
                <label class="counter-label" for="spellNone">None</label>
              </div>
            </div>
